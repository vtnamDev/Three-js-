name: Restore and validate PELAGIC V4

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/releasepart11"
      - ".bootstrap/trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[pelagic-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bootstrap files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore source archive and public fish assets
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/releasepart00
          test -f .bootstrap/releasepart11
          cat \
            .bootstrap/releasepart00 .bootstrap/releasepart01 .bootstrap/releasepart02 \
            .bootstrap/releasepart03a .bootstrap/releasepart03b1 \
            .bootstrap/releasepart03b2a .bootstrap/releasepart03b2b \
            .bootstrap/releasepart03b3 .bootstrap/releasepart03b4 \
            .bootstrap/releasepart03b5 .bootstrap/releasepart03b6 \
            .bootstrap/releasepart04 .bootstrap/releasepart05 .bootstrap/releasepart06 \
            .bootstrap/releasepart07 .bootstrap/releasepart08 .bootstrap/releasepart09 \
            .bootstrap/releasepart10 .bootstrap/releasepart11 \
            > /tmp/pelagic-source.tar.xz.b64
          base64 --decode /tmp/pelagic-source.tar.xz.b64 > /tmp/pelagic-source.tar.xz
          echo "Restored archive bytes: $(wc -c < /tmp/pelagic-source.tar.xz)"
          echo "Restored archive SHA-256: $(sha256sum /tmp/pelagic-source.tar.xz | cut -d' ' -f1)"
          echo "Expected SHA-256: 86600bfb7d0d44e6260fc3d10f455de3ee9770da223834e3af862f01986b3280"
          echo "86600bfb7d0d44e6260fc3d10f455de3ee9770da223834e3af862f01986b3280  /tmp/pelagic-source.tar.xz" | sha256sum --check -
          xz --test /tmp/pelagic-source.tar.xz
          tar -xJf /tmp/pelagic-source.tar.xz -C .
          mkdir -p public/assets/fish
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/BarramundiFish/glTF-Binary/BarramundiFish.glb \
            --output public/assets/fish/barramundi-hero.glb
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/BabylonJS/Assets/master/meshes/Demos/UnderWaterScene/fish/greySnapper_vertColor.glb \
            --output public/assets/fish/grey-snapper.glb
          test -s public/assets/fish/barramundi-hero.glb
          test -s public/assets/fish/grey-snapper.glb
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ASSET_CREDITS.md")
          s = p.read_text()
          s = s.replace(
              "Repacked textures losslessly/visually-losslessly from `11.91 MB` raw to `4.02 MB`",
              "The deployment bootstrap restores the original upstream GLB from the official Khronos repository; this version is larger than the optimized Barramundi GLB in the original source ZIP"
          )
          p.write_text(s)
          PY
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: publish PELAGIC V4 source [pelagic-bootstrap-complete]"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify fish models are included in dist
        run: |
          test -s dist/assets/fish/barramundi-hero.glb
          test -s dist/assets/fish/grey-snapper.glb
