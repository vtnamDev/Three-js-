name: Refresh npm lockfile
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-lock.trigger'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          rm -f scripts/refresh-lock.trigger
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json scripts/refresh-lock.trigger
            git commit -m "fix: synchronize npm lockfile"
            git push
          fi
