name: PELAGIC V5.1 Visual Fix Verification
on:
  push:
    branches:
      - main
      - fix/pelagic-v5-fish-rendering
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
      - name: Report generated bundle size
        run: |
          du -h dist/assets/* | sort -h
          find dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
